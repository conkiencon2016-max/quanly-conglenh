{% extends "layout.html" %}
{% block content %}

<div class="card p-4 card-dashboard">

<h4 class="mb-3">👤 Quản lý người đi công tác</h4>

<!-- ===== FORM THÊM CÁN BỘ ===== -->
<form method="post"
      action="/them_nguoidicongtac"
      class="row g-3 mb-4">

    <div class="col-md-4">
        <label>Họ tên</label>
        <input name="ho_ten"
               required
               class="form-control">
    </div>

    <div class="col-md-4">
        <label>Chức vụ</label>
        <input name="chuc_vu"
               required
               class="form-control">
    </div>

    <div class="col-md-4 d-flex align-items-end">
        <button type="submit"
                class="btn btn-success w-100">
            <i class="bi bi-plus-circle"></i> Thêm cán bộ
        </button>
    </div>

</form>

<!-- ===== BẢNG DANH SÁCH ===== -->
<table class="table table-striped table-hover">
<thead class="table-dark">
<tr>
<th>ID</th>
<th>Họ tên</th>
<th>Chức vụ</th>
<th>Thao tác</th>
</tr>
</thead>

<tbody>
{% for row in data %}
<tr>
<td>{{ row.id }}</td>
<td>{{ row.ho_ten }}</td>
<td>{{ row.chuc_vu }}</td>

<td>

<a href="/sua_nguoidicongtac/{{row.id}}"
   class="btn btn-sm btn-warning">
   <i class="bi bi-pencil"></i>
</a>

<a href="/xoa_nguoidicongtac/{{row.id}}"
   class="btn btn-sm btn-danger"
   onclick="return confirm('Xóa cán bộ này?')">
   <i class="bi bi-trash"></i>
</a>

</td>
</tr>
{% endfor %}
</tbody>
</table>

</div>

{% endblock %}
