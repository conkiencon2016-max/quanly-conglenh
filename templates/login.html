<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng nhập - Công lệnh</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:"Segoe UI",Arial;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(270deg,#1e3a8a,#2563eb,#1e40af);
    background-size:600% 600%;
    animation:bgMove 12s ease infinite;
}

/* animation nền */
@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* card */
.card{
    width:380px;
    background:#fff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 25px 60px rgba(0,0,0,0.25);
    text-align:center;
    position:relative;
}

/* dark mode */
body.dark{
    background:#0f172a;
}
body.dark .card{
    background:#1e293b;
    color:#fff;
}
body.dark input{
    background:#0f172a;
    color:#fff;
    border:1px solid #334155;
}

/* logo */
.logo{
    width:70px;
    margin-bottom:10px;
}

/* title */
h2{margin-bottom:5px}
.sub{
    font-size:13px;
    color:#64748b;
    margin-bottom:20px;
}

/* input */
.input-group{
    text-align:left;
    margin-bottom:15px;
    position:relative;
}

.input-group label{
    font-size:13px;
    font-weight:600;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border-radius:10px;
    border:1px solid #cbd5e1;
    outline:none;
}

/* show password */
.toggle-pass{
    position:absolute;
    right:10px;
    top:38px;
    cursor:pointer;
    font-size:14px;
    color:#64748b;
}

/* button */
button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:#fff;
    border:none;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#1d4ed8;
}

/* error */
.error{
    background:#fee2e2;
    color:#b91c1c;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
    font-size:14px;
}

/* dark toggle */
.dark-toggle{
    position:absolute;
    top:10px;
    right:15px;
    cursor:pointer;
}

/* footer */
.footer{
    margin-top:15px;
    font-size:12px;
    color:#94a3b8;
}

/* mobile */
@media(max-width:420px){
.card{
    width:90%;
    padding:25px;
}
}
</style>
</head>

<body>

<div class="card">

    <!-- toggle dark -->
    <div class="dark-toggle" onclick="toggleDark()">🌙</div>

    <!-- logo -->
    <img src="/static/1.jpg" class="logo">

    <h2>QUẢN LÝ CÔNG LỆNH</h2>
    <div class="sub">Văn phòng Tỉnh ủy Cà Mau</div>

    <!-- ERROR FLASK -->
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">

        <div class="input-group">
            <label>Tên đăng nhập</label>
            <input type="text" name="username" required>
        </div>

        <div class="input-group">
            <label>Mật khẩu</label>
            <input type="password" id="password" name="password" required>
            <span class="toggle-pass" onclick="togglePass()">👁</span>
        </div>

        <button type="submit">Đăng nhập hệ thống</button>

    </form>

    <div class="footer">
        Phòng Chuyển đổi số - Cơ yếu
    </div>

</div>

<script>
function togglePass(){
    let p = document.getElementById("password");
    p.type = (p.type === "password") ? "text" : "password";
}

function toggleDark(){
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
