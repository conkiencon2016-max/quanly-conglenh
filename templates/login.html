<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng nhập hệ thống</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/mobile.css">

<style>

body{
    margin:0;
    font-family:Segoe UI,Arial;
    background:url("/static/19.png") center/cover no-repeat fixed;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* overlay làm mờ background */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
z-index:0;
}

/* box login */

.login-box{
    position:relative;
    z-index:1;
    background:rgba(255,255,255,0.96);
    backdrop-filter:blur(6px);
    padding:35px;
    border-radius:16px;
    width:360px;
    box-shadow:0 15px 35px rgba(0,0,0,0.35);
    animation:fadeIn 0.5s ease;
}

/* animation */

@keyframes fadeIn{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

/* tiêu đề */

h3{
    text-align:center;
    margin-bottom:5px;
    color:#1f2937;
}

.subtitle{
    text-align:center;
    font-size:13px;
    color:#6b7280;
    margin-bottom:20px;
}

/* form */

.form-group{
    margin-bottom:15px;
}

label{
    font-weight:600;
    font-size:14px;
    color:#374151;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:8px;
    border:1px solid #ccc;
    transition:0.2s;
    font-size:14px;
}

input:focus{
    border-color:#2563EB;
    box-shadow:0 0 0 2px rgba(37,99,235,0.25);
    outline:none;
}

/* button */

.btn{
    width:100%;
    padding:11px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#2563EB,#1D4ED8);
    color:white;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
    transition:0.2s;
}

.btn:hover{
    transform:translateY(-1px);
    box-shadow:0 5px 12px rgba(0,0,0,0.25);
}

/* error */

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:8px;
    border-radius:6px;
    text-align:center;
    margin-bottom:10px;
    font-size:14px;
}

/* footer */

.footer{
    text-align:center;
    margin-top:15px;
    font-size:12px;
    color:#6b7280;
}

/* mobile */

@media(max-width:420px){

.login-box{
width:90%;
padding:25px;
}

}

</style>
</head>

<body>

<div class="login-box">

<h3>🔐 QUẢN LÝ CÔNG LỆNH</h3>


{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="post">

<div class="form-group">
<label>Tài khoản</label>
<input name="username" placeholder="Nhập tài khoản" required>
</div>

<div class="form-group">
<label>Mật khẩu</label>
<input type="password" name="password" placeholder="Nhập mật khẩu" required>
</div>

<button class="btn">Đăng nhập hệ thống</button>

</form>

<div class="footer">

<b>Phòng Chuyển đổi số - Cơ yếu</b><br>
Văn phòng Tỉnh ủy Cà Mau

</div>

</div>

</body>
</html>
