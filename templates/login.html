<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng nhập hệ thống</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    font-family:Segoe UI,Arial;
    background:linear-gradient(135deg,#1e3a8a,#2563eb);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:white;
    padding:35px;
    border-radius:14px;
    width:340px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    animation:fadeIn 0.4s ease-in-out;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(15px);}
    to{opacity:1;transform:translateY(0);}
}

h3{
    text-align:center;
    margin-bottom:25px;
    color:#1f2937;
}

.form-group{
    margin-bottom:15px;
}

label{
    font-weight:600;
    font-size:14px;
}

input{
    width:100%;
    padding:9px;
    margin-top:5px;
    border-radius:6px;
    border:1px solid #ccc;
    transition:0.2s;
}

input:focus{
    border-color:#2563EB;
    box-shadow:0 0 0 2px rgba(37,99,235,0.2);
    outline:none;
}

.btn{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#2563EB;
    color:white;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
}

.btn:hover{
    opacity:0.9;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:8px;
    border-radius:6px;
    text-align:center;
    margin-bottom:10px;
    font-size:14px;
}

.footer{
    text-align:center;
    margin-top:15px;
    font-size:13px;
    color:#6b7280;
}
</style>
</head>

<body>

<div class="login-box">

<h3>🔐 QUẢN LÝ CÔNG LỆNH</h3>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="post">
    <div class="form-group">
        <label>Tài khoản</label>
        <input name="username" required>
    </div>

    <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" name="password" required>
    </div>

    <button class="btn">Đăng nhập</button>
</form>

<div class="footer">
   
<h4>@ Phòng Chuyển đổi số - Cơ yếu, VPTU Cà Mau
</h4>
</div>

</div>

</body>
</html>
